<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지구 탈출 프로젝트 - 드림호(Dream) 보드게임</title>
<style>
  :root{
    --bg:#0e1330; --panel:#171d45; --panel2:#1f2757; --text:#eef1ff; --muted:#9aa4d6;
    --good:#2fbf71; --bad:#ef5b5b; --rest:#4a8cff; --again:#f5a623; --goal:#9b7bff;
    --p0:#2fbf71; --p1:#ef5b5b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:radial-gradient(ellipse at top,#1b2260 0%,var(--bg) 60%);color:var(--text);min-height:100vh}
  .wrap{display:flex;gap:20px;padding:20px;max-width:1300px;margin:0 auto;align-items:flex-start}
  .side{width:340px;flex-shrink:0;background:var(--panel);border-radius:18px;padding:20px;box-shadow:0 8px 30px #0006}
  .side h1{margin:0 0 4px;font-size:26px;line-height:1.25;text-align:center}
  .side .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px}
  .player{border:2px solid transparent;background:var(--panel2);border-radius:14px;padding:12px 14px;margin-bottom:10px;transition:.2s}
  .player.active{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
  .player .name{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--c);display:inline-block}
  .player .state{color:var(--muted);font-size:14px;margin-top:4px}
  label.small{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
  .row{display:flex;gap:8px}
  #dice{width:84px;font-size:34px;font-weight:800;text-align:center;border-radius:12px;border:2px solid #3a4584;background:#0f1538;color:#fff;padding:6px 0}
  button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-weight:800}
  #go{flex:1;background:#5b8cff;color:#fff;font-size:20px}
  #go:disabled{opacity:.45;cursor:not-allowed}
  #reset,#sound{width:100%;margin-top:8px;background:#2a3370;color:var(--text);padding:12px;font-size:15px}
  .opt{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:14px;line-height:1.4}
  .opt input{margin-top:3px}
  #msg{margin-top:14px;background:#0f1538;border-radius:12px;padding:12px;font-size:15px;min-height:64px;line-height:1.5}
  #ask{display:none;margin-top:10px;background:#2b2150;border:2px solid var(--again);border-radius:12px;padding:12px}
  #ask p{margin:0 0 8px;font-size:15px;line-height:1.45}
  #ask button{padding:10px 14px;font-size:15px;margin-right:6px}
  #askYes{background:var(--good);color:#fff}
  #askNo{background:var(--bad);color:#fff}
  #log{margin-top:12px;max-height:150px;overflow:auto;font-size:13px;color:var(--muted);line-height:1.6}
  .board{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .cell{position:relative;aspect-ratio:1/0.92;background:#1a2150;border:2px solid #2d3877;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px}
  .cell .n{position:absolute;top:5px;left:8px;font-size:12px;color:#7d89c9;font-weight:700}
  .cell .ic{font-size:clamp(22px,3.2vw,38px);line-height:1}
  .cell .lb{font-size:clamp(10px,1.1vw,13px);font-weight:700;margin-top:3px;line-height:1.2}
  .cell.good{border-color:var(--good);background:#16352f}
  .cell.bad{border-color:var(--bad);background:#3a1f33}
  .cell.rest{border-color:var(--rest);background:#182d5c}
  .cell.again{border-color:var(--again);background:#3a3020}
  .cell.start{border-color:#59d4c0;background:#143a3f}
  .cell.goal{border-color:var(--goal);background:#2c2563}
  .tokens{position:absolute;bottom:4px;right:6px;display:flex;gap:2px}
  .token{width:clamp(20px,2.6vw,32px);height:clamp(20px,2.6vw,32px);border-radius:50%;background:var(--c);
    display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.6vw,18px);border:2px solid #fff;
    box-shadow:0 2px 6px #0008;animation:pop .25s}
  @keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
  #win{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:9}
  #win .box{background:var(--panel);padding:36px 44px;border-radius:22px;text-align:center;max-width:90vw}
  #win h2{font-size:34px;margin:0 0 10px}
  #win p{color:var(--muted);font-size:18px;margin:0 0 20px}
  #win button{background:#5b8cff;color:#fff;font-size:18px;padding:12px 28px}
  @media(max-width:860px){
    .wrap{flex-direction:column;padding:12px}
    .side{width:100%}
    .board{width:100%;gap:6px}
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <h1>🚀 지구 탈출 프로젝트<br>드림호(Dream) 작전</h1>
    <div class="sub">소행성 충돌 D-day! 새 행성까지 먼저 도착하라</div>

    <div class="player active" id="pl0" style="--c:var(--p0)">
      <div class="name"><span class="dot"></span><span id="nm0">1팀 · 초록 우주선</span></div>
      <div class="state" id="st0">출발 대기</div>
    </div>
    <div class="player" id="pl1" style="--c:var(--p1)">
      <div class="name"><span class="dot"></span><span id="nm1">2팀 · 빨간 우주선</span></div>
      <div class="state" id="st1">출발 대기</div>
    </div>

    <label class="small" for="dice">마이크로비트 주사위 값 (1~6)</label>
    <div class="row">
      <input id="dice" type="number" min="1" max="6" value="1" inputmode="numeric">
      <button id="go">이동하기</button>
    </div>

    <label class="opt">
      <input type="checkbox" id="mission">
      <span>🛡 마이크로비트 미션 모드<br>위기 칸(뒤로 가기·쉬기)에 멈추면 마이크로비트 미션에 성공해야 피할 수 있어요.</span>
    </label>

    <div id="ask">
      <p id="askText"></p>
      <button id="askYes">성공 ✅</button><button id="askNo">실패 ❌</button>
    </div>

    <div id="msg">주사위를 굴려 입력하고 <b>이동하기</b>를 눌러 보세요!</div>
    <div id="log"></div>
    <button id="sound">🔊 효과음 켜짐</button>
    <button id="reset">처음부터</button>
  </aside>

  <main class="board" id="board"></main>
</div>

<div id="win"><div class="box">
  <h2 id="winTitle"></h2>
  <p>드림호가 새 행성에 무사히 도착했습니다! 🪐</p>
  <button id="again">한 판 더</button>
</div></div>

<script>
const GOAL = 30;
const NAMES = ["1팀 · 초록 우주선", "2팀 · 빨간 우주선"];

// 칸 이벤트: type = good(앞으로) | bad(뒤로) | rest(쉬기) | again(한 번 더)
const EV = {
  3:  {type:"good",  d:+3, icon:"⛽", label:"+3칸<br>연료 보급!", msg:"연료 보급 성공! 3칸 앞으로 이동합니다."},
  7:  {type:"bad",   d:-3, icon:"☄️", label:"-3칸<br>운석 충돌", msg:"운석과 충돌했어요! 3칸 뒤로 밀려납니다.", mission:"A버튼을 눌러 방어막을 가동하세요!"},
  10: {type:"rest",  icon:"🫧", label:"쉬기<br>산소 부족", msg:"산소가 부족해요. 다음 차례를 쉽니다.", mission:"마이크로비트를 5번 흔들어 산소를 복구하세요!"},
  13: {type:"good",  d:+4, icon:"☀️", label:"+4칸<br>태양풍 가속!", msg:"태양풍을 타고 4칸 앞으로 쑥!"},
  16: {type:"bad",   d:-2, icon:"🌀", label:"-2칸<br>궤도 이탈", msg:"궤도를 이탈했어요! 2칸 뒤로 이동합니다.", mission:"A버튼을 눌러 방어막을 가동하세요!"},
  19: {type:"again", icon:"🔋", label:"한번더<br>재충전!", msg:"에너지 재충전 완료! 한 번 더 굴리세요."},
  22: {type:"good",  d:+3, icon:"🤝", label:"+3칸<br>동료 지원!", msg:"동료 우주선이 도와줬어요! 3칸 앞으로."},
  25: {type:"bad",   d:-4, icon:"🕳️", label:"-4칸<br>블랙홀", msg:"블랙홀에 끌려갑니다! 4칸 뒤로...", mission:"A버튼을 눌러 방어막을 가동하세요!"},
  28: {type:"rest",  icon:"🔧", label:"쉬기<br>엔진 고장", msg:"엔진이 고장났어요. 다음 차례를 쉽니다.", mission:"마이크로비트를 5번 흔들어 엔진을 수리하세요!"},
};
const FILLERS = ["🌌","⭐","🛰️","🌠","🪐","✨"];

const pos = [1,1], skip = [false,false];
let turn = 0, busy = false, over = false;
const cells = {}, tokenEls = [];

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- 효과음 (Web Audio, 파일 없이 합성) ---------- */
let audioCtx = null, soundOn = true;
function ac(){
  if(!audioCtx){
    const A = window.AudioContext || window.webkitAudioContext;
    if(A) audioCtx = new A();
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type="sine", vol=0.15, slideTo){
  const c = ac();
  if(!c || !soundOn) return;
  const t = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const SFX = {
  roll(){ tone(700,0,0.05,"square",0.07); tone(500,0.07,0.05,"square",0.07); },
  step(n, back){                       // 칸을 한 칸 지날 때마다 "톡"
    const base = back ? 420 : 520;
    tone(base + (back ? -n*18 : n*22), 0, 0.11, "triangle", 0.13);
  },
  good(){ [523,659,784,1047].forEach((f,i)=>tone(f, i*0.09, 0.18, "square", 0.08)); },       // 상승 팡파르
  bad(){ tone(320,0,0.55,"sawtooth",0.11,70); tone(160,0.05,0.5,"square",0.07,50); },        // 하강 경고음
  rest(){ tone(330,0,0.25,"sine",0.14); tone(262,0.25,0.25,"sine",0.14); tone(196,0.5,0.45,"sine",0.14); },
  again(){ [784,988,1175,1568].forEach((f,i)=>tone(f, i*0.06, 0.12, "triangle", 0.12)); },   // 반짝 충전음
  ok(){ tone(880,0,0.12,"sine",0.14); tone(1320,0.12,0.28,"sine",0.14); },                   // 미션 성공
  win(){                                                                                       // 탈출 성공 팡파르
    const seq = [[523,0],[523,.14],[523,.28],[659,.42],[784,.62],[659,.82],[784,1.0],[1047,1.25]];
    seq.forEach(([f,t],i)=>tone(f, t, i===seq.length-1 ? 0.9 : 0.16, "square", 0.09));
    [523,659,784,1047].forEach(f=>tone(f, 1.25, 1.1, "triangle", 0.07));
  }
};

/* ---------- 보드 만들기 (뱀 모양, 아래→위) ---------- */
function buildBoard(){
  const board = $("board");
  board.innerHTML = "";
  for(let r=4; r>=0; r--){
    for(let c=0; c<6; c++){
      const n = r*6 + (r%2===0 ? c+1 : 6-c);
      const el = document.createElement("div");
      el.className = "cell";
      let icon, label = "";
      if(n===1){ el.classList.add("start"); icon="🌍"; label="출발!<br>지구"; }
      else if(n===GOAL){ el.classList.add("goal"); icon="🪐"; label="도착!<br>새 행성"; }
      else if(EV[n]){ el.classList.add(EV[n].type); icon=EV[n].icon; label=EV[n].label; }
      else { icon=FILLERS[n%FILLERS.length]; label=""; }
      el.innerHTML = `<span class="n">${n}</span><span class="ic">${icon}</span><span class="lb">${label}</span><div class="tokens"></div>`;
      board.appendChild(el);
      cells[n] = el;
    }
  }
}

function makeTokens(){
  [0,1].forEach(i=>{
    const t = document.createElement("div");
    t.className = "token";
    t.style.setProperty("--c", i===0 ? "var(--p0)" : "var(--p1)");
    t.textContent = i===0 ? "🚀" : "🛸";
    tokenEls[i] = t;
  });
}
function place(i){
  cells[pos[i]].querySelector(".tokens").appendChild(tokenEls[i]);
}

/* ---------- 표시 ---------- */
function say(t){ $("msg").innerHTML = t; }
function log(t){
  const d = document.createElement("div");
  d.textContent = "• " + t;
  $("log").prepend(d);
}
function refresh(){
  [0,1].forEach(i=>{
    $("pl"+i).classList.toggle("active", turn===i && !over);
    $("st"+i).textContent = pos[i]===1 ? "출발 대기" : `${pos[i]}번 칸` + (skip[i] ? " · 다음 차례 쉬기" : "");
  });
  $("go").disabled = busy || over;
}

/* ---------- 이동 ---------- */
async function walk(i, target){
  const dir = target > pos[i] ? 1 : -1;
  let n = 0;
  while(pos[i] !== target){
    pos[i] += dir;
    place(i);
    SFX.step(n++, dir < 0);
    refresh();
    await sleep(260);
  }
}

function ask(text){
  return new Promise(res=>{
    $("askText").textContent = text;
    $("ask").style.display = "block";
    const done = v => { $("ask").style.display = "none"; res(v); };
    $("askYes").onclick = () => done(true);
    $("askNo").onclick  = () => done(false);
  });
}

function nextTurn(){
  turn = 1 - turn;
  if(skip[turn]){
    skip[turn] = false;
    log(`${NAMES[turn]}: 이번 차례는 쉬어요.`);
    say(`${NAMES[turn]}은(는) 이번 차례를 쉽니다. ${NAMES[1-turn]} 차례!`);
    turn = 1 - turn;
  }
}

async function roll(){
  if(busy || over) return;
  const v = parseInt($("dice").value, 10);
  if(!(v>=1 && v<=6)){ say("⚠️ 주사위 값은 1~6만 입력할 수 있어요."); return; }

  busy = true; refresh();
  SFX.roll();
  const p = turn;
  log(`${NAMES[p]}: 주사위 ${v}`);
  const target = Math.min(pos[p] + v, GOAL);
  say(`${NAMES[p]} — 주사위 <b>${v}</b>! 이동합니다...`);
  await walk(p, target);

  if(pos[p] >= GOAL){ return win(p); }

  const ev = EV[pos[p]];
  if(!ev){
    say(`${pos[p]}번 칸에 도착! 아무 일도 없어요.`);
    nextTurn();
  } else {
    say(`<b>${ev.icon} ${ev.msg}</b>`);
    log(`${pos[p]}번 칸: ${ev.msg}`);
    const useMission = $("mission").checked;

    if(ev.type==="good"){
      SFX.good();
      await sleep(700);
      await walk(p, pos[p] + ev.d);
      nextTurn();
    } else if(ev.type==="bad"){
      let avoided = false;
      if(useMission) avoided = await ask(ev.mission + " 성공했나요?");
      if(avoided){ SFX.ok(); say("🛡 방어 성공! 피해 없이 통과했어요."); log("방어 성공!"); }
      else { SFX.bad(); await sleep(700); await walk(p, Math.max(1, pos[p] + ev.d)); }
      nextTurn();
    } else if(ev.type==="rest"){
      let fixed = false;
      if(useMission) fixed = await ask(ev.mission + " 성공했나요?");
      if(fixed){ SFX.ok(); say("🔧 복구 성공! 쉬지 않고 계속 갑니다."); log("복구 성공!"); }
      else { SFX.rest(); skip[p] = true; }
      nextTurn();
    } else if(ev.type==="again"){
      SFX.again(); /* 같은 팀이 한 번 더 */
    }
  }
  if(!over){
    const t = turn;
    $("msg").innerHTML += `<br>▶ <b>${NAMES[t]}</b> 차례`;
  }
  busy = false;
  refresh();
  $("dice").focus(); $("dice").select();
}

function win(p){
  over = true; busy = false; refresh();
  SFX.win();
  log(`🏆 ${NAMES[p]} 도착!`);
  $("winTitle").textContent = `🏆 ${NAMES[p]} 도착!`;
  $("win").style.display = "flex";
}

function resetGame(){
  pos[0]=pos[1]=1; skip[0]=skip[1]=false; turn=0; busy=false; over=false;
  $("win").style.display = "none";
  $("ask").style.display = "none";
  $("log").innerHTML = "";
  $("dice").value = 1;
  place(0); place(1);
  say("주사위를 굴려 입력하고 <b>이동하기</b>를 눌러 보세요!");
  refresh();
}

/* ---------- 시작 ---------- */
buildBoard(); makeTokens(); place(0); place(1); refresh();
$("go").onclick = roll;
$("dice").addEventListener("keydown", e => { if(e.key==="Enter") roll(); });
$("reset").onclick = resetGame;
$("sound").onclick = () => {
  soundOn = !soundOn;
  $("sound").textContent = soundOn ? "🔊 효과음 켜짐" : "🔇 효과음 꺼짐";
  if(soundOn){ ac(); SFX.ok(); }
};
$("again").onclick = resetGame;
</script>
</body>
</html>
